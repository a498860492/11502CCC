
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 會議時間投票</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#243342;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:24px 12px}main{max-width:850px;margin:auto}.hero{background:linear-gradient(115deg,#183e66,#188c91);color:white;border-radius:18px;padding:30px 26px}h1{margin:5px 0 10px;font-size:26px}h2{font-size:19px;margin:0 0 4px}.sub{color:#617184;font-size:13px}.hero .sub{color:#e0f5f7}.card{background:white;border:1px solid #e0e7eb;border-radius:15px;padding:22px;margin-top:16px;box-shadow:0 2px 9px #122a3d09}.field{width:100%;padding:12px;border:1px solid #becbd3;border-radius:9px;font-size:16px;margin:8px 0 0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:16px}.option{padding:12px;border:1px solid #d5e2e7;border-radius:10px;display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.option:has(input:checked){background:#e8f8f7;border-color:#168f96}.option input{accent-color:#10858e}button{border:0;background:#147d90;color:white;padding:13px 20px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}.stat{margin-top:18px}.stat-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}.track{height:12px;border-radius:10px;background:#eef2f5;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,#5bb8b9,#158195);border-radius:10px;transition:width .3s}.names{color:#657487;font-size:13px;line-height:1.6}.alert{color:#ab3c23}.ok{color:#14785f}.footer{font-size:12px;color:#6a7785;margin:18px 2px}a{color:#167a91}@media(max-width:550px){.options{grid-template-columns:1fr}h1{font-size:23px}.card{padding:17px}}
</style></head><body><main><header class="hero"><small>2026 · MEETING POLL</small><h1>會議時間意願調查</h1><div class="sub">勾選可出席時段，送出後公開顯示票數與委員姓名</div></header><section class="card"><label for="name"><b>委員姓名</b></label><input class="field" id="name" placeholder="請輸入姓名" maxlength="40"><p class="sub">同一姓名再次提交同一會議，會取代該會議原本選項。姓名及投票時段將公開顯示給所有瀏覽者。</p></section><div id="meetings"></div><section class="card"><div class="controls"><button id="refresh">更新投票統計</button><span id="status" class="sub" role="status">尚未連接資料服務</span></div><div id="results"></div></section><p class="footer">票數每 15 秒自動更新。此頁為公開姓名投票，請勿填寫非必要個資。採用姓名識別，無法防止其他人冒用相同姓名。</p></main>
<script>
/* 部署 Apps Script 後，將下方網址替換成以 /exec 結尾的網頁應用程式網址 */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyZS9jcMC_pj63m6gNo7xdtFsSPIKEjM7GFTbTTJWCk1-r8yohOI3C4i4yuOZg8gzJWug/exec';
const meetings=[{key:'ccc',title:'CCC 臨床能力委員會',note:'線上會議 · 13:00–14:30',dates:['11/16（一）','11/27（五）','11/30（一）']},{key:'review',title:'進階展延審核會議',note:'白宮 VIP · 上午／下午可分別勾選',dates:['12/21（一）上午','12/21（一）下午','12/22（二）上午','12/22（二）下午','12/24（四）上午','12/24（四）下午','12/25（五）上午','12/25（五）下午']}];
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);let busy=false;
$('#meetings').innerHTML=meetings.map(m=>`<section class="card"><h2>${m.title}</h2><div class="sub">${m.note} · 可複選</div><div class="options">${m.dates.map((d,i)=>`<label class="option"><input type="checkbox" name="${m.key}" value="${i}"><span>${d}</span></label>`).join('')}</div><div class="controls"><button data-submit="${m.key}">送出／更新這場會議</button><span class="sub">可分別提交兩場會議</span></div></section>`).join('');
function status(msg,good){$('#status').textContent=msg;$('#status').className=good?'ok':'sub alert'}
function callApi(args){return new Promise((resolve,reject)=>{if(!SCRIPT_URL.startsWith('https://script.google.com/'))return reject(Error('請先在 HTML 中設定 Apps Script 網址'));const id='vote_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const s=document.createElement('script');let finished=false;let tm=setTimeout(()=>finish(Error('連線逾時，請檢查 Apps Script 部署權限')),15000);function finish(err,data){if(finished)return;finished=true;clearTimeout(tm);s.remove();delete window[id];err?reject(err):resolve(data)}window[id]=v=>finish(null,v);s.onerror=()=>finish(Error('無法連接 Apps Script'));s.src=SCRIPT_URL+'?'+new URLSearchParams({...args,callback:id,t:Date.now()});document.head.appendChild(s)})}
function render(data){$('#results').innerHTML=meetings.map(m=>{let r=data[m.key]||{voters:0,options:[]};return `<div class="stat"><h2>${m.title}</h2><div class="sub">已投票 ${r.voters} 人</div>${(r.options||[]).map(o=>{let pct=r.voters?Math.round(o.count/r.voters*100):0;return `<div class="stat"><div class="stat-line"><span>${escapeHtml(o.label)}</span><b>${o.count} 票 · ${pct}%</b></div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="names">${o.names.length?o.names.map(escapeHtml).join('、'):'尚無委員選擇'}</div></div>`}).join('')}</div>`}).join('')}
async function load(){try{let res=await callApi({action:'results'});if(!res.ok)throw Error(res.error);render(res.results);status('統計已更新 · '+new Date().toLocaleTimeString('zh-TW'),true)}catch(e){status(e.message,false)}}
document.querySelectorAll('[data-submit]').forEach(b=>b.addEventListener('click',async()=>{if(busy)return;const name=$('#name').value.trim();const meeting=b.dataset.submit;const selected=[...document.querySelectorAll(`input[name="${meeting}"]:checked`)].map(x=>x.value);if(!name)return status('請先輸入委員姓名',false);if(!selected.length)return status('請至少勾選一個時段',false);busy=true;b.disabled=true;status('正在提交…');try{let r=await callApi({action:'vote',name,meeting,selected:selected.join(',')});if(!r.ok)throw Error(r.error);render(r.results);status('已儲存 '+name+' 的投票',true)}catch(e){status(e.message,false)}finally{busy=false;b.disabled=false}}));$('#refresh').addEventListener('click',load);load();setInterval(()=>{if(!busy)load()},15000);
</script></body></html>
